services:
  livetiming:
    image: ghcr.io/hochgesand/24hrennenlivetiming:latest
    container_name: livetiming
    pull_policy: always
    restart: unless-stopped
    ports:
      - "62757:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
