# Expose JS bundles to cross-origin error reporting / devtools (same-origin scripts).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# SPA fallback: serve index.html for client-side routes (history API).
# Skip this if the app is only ever loaded at `/` (e.g. query/hash state only).
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
